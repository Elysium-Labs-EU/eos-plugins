name: Gitleaks

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  merge_group:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Prebuilt, pinned binary instead of gitleaks/gitleaks-action, which
      # requires a paid GITLEAKS_LICENSE for organization repos (see
      # https://github.com/gitleaks/gitleaks-action#license) — the CLI itself
      # is free and unrestricted.
      - name: Install gitleaks (prebuilt, pinned)
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz" -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          chmod +x gitleaks
          ./gitleaks version

      - name: Run gitleaks
        run: ./gitleaks detect --source . --no-git -v

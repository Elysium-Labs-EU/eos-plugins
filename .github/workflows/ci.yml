name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  merge_group:

permissions:
  contents: read
  pull-requests: read

jobs:
  typos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check for typos
        uses: crate-ci/typos@v1.48.0

  lint:
    strategy:
      fail-fast: false
      matrix:
        plugin:
          - eos-sink-logbench
          - eos-sink-loki
          - eos-sink-otlp
          - eos-sink-sse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: ${{ matrix.plugin }}/go.mod
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11
          working-directory: ${{ matrix.plugin }}

  test:
    strategy:
      fail-fast: false
      matrix:
        plugin:
          - eos-sink-logbench
          - eos-sink-loki
          - eos-sink-otlp
          - eos-sink-sse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: ${{ matrix.plugin }}/go.mod
      - name: go mod verify
        working-directory: ${{ matrix.plugin }}
        run: go mod verify
      - name: Run tests
        working-directory: ${{ matrix.plugin }}
        run: go test ./... -v -race

  protocol-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check plugin contract against PROTOCOL.md
        run: ./scripts/check-protocol-drift.sh

  any-convention:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check any-vs-interface{} convention
        run: ./scripts/check-any-convention.sh

  large-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # diffs changed files against origin/main
      - name: Check for large or binary blobs
        run: ./scripts/check-large-files.sh

  crap:
    strategy:
      fail-fast: false
      matrix:
        plugin:
          - eos-sink-logbench
          - eos-sink-loki
          - eos-sink-otlp
          - eos-sink-sse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # go-crap-gate diffs changed functions against origin/main
      - uses: actions/setup-go@v7
        with:
          go-version-file: ${{ matrix.plugin }}/go.mod
      - name: Install go-crap
        run: go install github.com/padiazg/go-crap@latest
      - name: Run go-crap gate
        working-directory: ${{ matrix.plugin }}
        run: make crap

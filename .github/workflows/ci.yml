name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  merge_group:

permissions:
  contents: read
  pull-requests: read

jobs:
  typos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check for typos
        uses: crate-ci/typos@bee27e3a4fd1ea2111cf90ab89cd076c870fce14 # v1.48.0

  lint:
    strategy:
      fail-fast: false
      matrix:
        plugin:
          - eos-sink-logbench
          - eos-sink-loki
          - eos-sink-otlp
          - eos-sink-sse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: ${{ matrix.plugin }}/go.mod
      # Read from the same file the Makefiles use, so a contributor's local
      # `make lint` and this gate can never run different linter versions.
      - name: Resolve golangci-lint version
        id: golangci
        run: echo "version=$(cat .golangci-version)" >> "$GITHUB_OUTPUT"
      - name: golangci-lint
        uses: golangci/golangci-lint-action@db9de0fc1a667e1a49d2291a1a042dff081d78f6 # v9
        with:
          version: ${{ steps.golangci.outputs.version }}
          working-directory: ${{ matrix.plugin }}

  test:
    strategy:
      fail-fast: false
      matrix:
        plugin:
          - eos-sink-logbench
          - eos-sink-loki
          - eos-sink-otlp
          - eos-sink-sse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: ${{ matrix.plugin }}/go.mod
      - name: go mod verify
        working-directory: ${{ matrix.plugin }}
        run: go mod verify
      - name: Run tests
        working-directory: ${{ matrix.plugin }}
        run: go test ./... -v -race

  protocol-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check plugin contract against PROTOCOL.md
        run: ./scripts/check-protocol-drift.sh

  install-script:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Shellcheck install.sh and scripts
        run: shellcheck install.sh scripts/*.sh
      - name: Run install.sh unit tests
        run: ./scripts/test-install.sh
      - name: Run release.sh unit tests
        run: ./scripts/test-release.sh

  golangci-pin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check the golangci-lint version has one source of truth
        run: ./scripts/check-golangci-pin.sh

  any-convention:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check any-vs-interface{} convention
        run: ./scripts/check-any-convention.sh

  large-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # diffs changed files against origin/main
      - name: Check for large or binary blobs
        run: ./scripts/check-large-files.sh

  crap:
    strategy:
      fail-fast: false
      matrix:
        plugin:
          - eos-sink-logbench
          - eos-sink-loki
          - eos-sink-otlp
          - eos-sink-sse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # go-crap-gate diffs changed functions against origin/main
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: ${{ matrix.plugin }}/go.mod
      - name: Install go-crap
        run: go install github.com/padiazg/go-crap@latest
      - name: Run go-crap gate
        working-directory: ${{ matrix.plugin }}
        run: make crap

  govulncheck:
    strategy:
      fail-fast: false
      matrix:
        plugin:
          - eos-sink-logbench
          - eos-sink-loki
          - eos-sink-otlp
          - eos-sink-sse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1.1.0
        with:
          go-version-file: ${{ matrix.plugin }}/go.mod
          work-dir: ${{ matrix.plugin }}

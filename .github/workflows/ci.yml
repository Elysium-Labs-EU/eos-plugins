name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  merge_group:

permissions:
  contents: read
  pull-requests: read

jobs:
  lint:
    strategy:
      fail-fast: false
      matrix:
        plugin:
          - eos-sink-logbench
          - eos-sink-loki
          - eos-sink-otlp
          - eos-sink-sse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: ${{ matrix.plugin }}/go.mod
      - name: golangci-lint
        uses: golangci/golangci-lint-action@db9de0fc1a667e1a49d2291a1a042dff081d78f6 # v9
        with:
          version: v2.11
          working-directory: ${{ matrix.plugin }}

  test:
    strategy:
      fail-fast: false
      matrix:
        plugin:
          - eos-sink-logbench
          - eos-sink-loki
          - eos-sink-otlp
          - eos-sink-sse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: ${{ matrix.plugin }}/go.mod
      - name: Run tests
        working-directory: ${{ matrix.plugin }}
        run: go test ./... -v -race

  crap:
    strategy:
      fail-fast: false
      matrix:
        plugin:
          - eos-sink-logbench
          - eos-sink-loki
          - eos-sink-otlp
          - eos-sink-sse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # go-crap-gate diffs changed functions against origin/main
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: ${{ matrix.plugin }}/go.mod
      - name: Install go-crap
        run: go install github.com/padiazg/go-crap@latest
      - name: Run go-crap gate
        working-directory: ${{ matrix.plugin }}
        run: make crap

  govulncheck:
    strategy:
      fail-fast: false
      matrix:
        plugin:
          - eos-sink-logbench
          - eos-sink-loki
          - eos-sink-otlp
          - eos-sink-sse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: ${{ matrix.plugin }}/go.mod
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
      - name: Run govulncheck
        working-directory: ${{ matrix.plugin }}
        run: govulncheck ./...

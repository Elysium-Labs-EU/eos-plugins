name: SonarQube Cloud

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  merge_group:

permissions:
  contents: read
  pull-requests: read

jobs:
  sonarqube:
    runs-on: ubuntu-latest
    env:
      # A Dependabot-triggered run reads from the repository's Dependabot
      # secret store, not the Actions one, so secrets.SONAR_TOKEN is empty
      # there and the scan cannot authorize. Resolved once at the job level
      # because the secrets context is not available to a step-level `if`.
      HAS_SONAR_TOKEN: ${{ secrets.SONAR_TOKEN != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # SonarQube needs full history for accurate blame/new-code analysis
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: eos-sink-loki/go.mod

      - name: Run tests with coverage
        run: |
          for plugin in eos-sink-logbench eos-sink-loki eos-sink-otlp eos-sink-sse; do
            (cd "$plugin" && go test ./... -coverprofile=coverage.out)
          done

      - name: SonarQube Cloud Scan
        if: env.HAS_SONAR_TOKEN == 'true'
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      # Skipping silently would read as a green Sonar run on a PR that was
      # never analysed. The coverage build above still ran, which is the part
      # that catches a broken dependency bump; main and the merge queue both
      # have the token and are analysed normally.
      - name: Note the skipped scan
        if: env.HAS_SONAR_TOKEN != 'true'
        run: |
          echo "::notice title=SonarQube scan skipped::No SONAR_TOKEN available to this run (expected for Dependabot PRs, which read the Dependabot secret store). Tests and coverage ran; analysis happens on main and in the merge queue."

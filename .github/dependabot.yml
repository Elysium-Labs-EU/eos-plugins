# Dependabot only opens PRs here — it never merges anything. No auto-merge
# workflow exists in .github/, and none should be added without a deliberate
# decision: every version bump gets a human review before it lands.
version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/eos-sink-logbench"
    schedule:
      interval: "weekly"
    labels:
      - dependencies
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: "gomod"
    directory: "/eos-sink-loki"
    schedule:
      interval: "weekly"
    labels:
      - dependencies
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: "gomod"
    directory: "/eos-sink-otlp"
    schedule:
      interval: "weekly"
    labels:
      - dependencies
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: "gomod"
    directory: "/eos-sink-sse"
    schedule:
      interval: "weekly"
    labels:
      - dependencies
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: "chore(ci)"
